name: Build PDF/EPUB Book

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rolling-release
  cancel-in-progress: false

jobs:
  build-book:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-fonts-recommended texlive-fonts-extra latexmk fonts-dejavu

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Mermaid CLI
        env:
          # Diagrams are rendered with the runner's Chrome instead of a second download.
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: |
          mkdir -p build/tools
          npm install --prefix build/tools --no-audit --no-fund @mermaid-js/mermaid-cli@10.9.1

      - name: Generate Book Files
        run: |
          mkdir -p build
          BUILD_DATE="$(date -u +%Y-%m-%d)"
          
          # Generate front matter inline
          cat > build/front-matter.md << FRONTMATTER
          ---
          title: System Design Patterns
          subtitle: A Field Guide to Production Distributed Systems
          author: Babushkai
          date: "$BUILD_DATE"
          ---

          # Preface

          This book is a curated engineering field guide to production distributed systems. It develops designs from contracts and invariants through protocols, capacity limits, failure recovery, security boundaries, observability, migration, and verification. Chapters state what they own and cross-reference neighboring mechanisms instead of repeating generic checklists.

          ## Who This Book Is For

          - Engineers and architects making production design decisions
          - Operators diagnosing failure, overload, recovery, and consistency behavior
          - Readers who want mechanisms and evidence beyond interview diagrams

          ## How to Use This Book

          The parts progress from storage and distributed-systems foundations through service, data, ML/LLM, workflow, and engineering-platform architectures. Read a chapter's scope boundary first, then follow its invariants, control and data paths, quantitative assumptions, specialized failure traces, rollout mechanics, decision framework, and primary references. Worked numbers are either sourced to the described system or explicitly labeled as illustrative inputs.

          \newpage
          FRONTMATTER

          # Generate metadata inline
          cat > build/metadata.yaml << 'METADATA'
          title: "System Design Patterns"
          subtitle: "A Field Guide to Production Distributed Systems"
          author: "Babushkai"
          rights: "MIT License"
          language: "en-US"
          documentclass: report
          papersize: a4
          fontsize: 11pt
          # Code blocks use arrows, box-drawing characters, and Greek letters that the
          # default Latin Modern fonts do not carry; DejaVu covers all of them.
          mainfont: "DejaVu Serif"
          sansfont: "DejaVu Sans"
          monofont: "DejaVu Sans Mono"
          geometry:
            - margin=1in
          toc: true
          toc-depth: 2
          numbersections: true
          colorlinks: true
          linkcolor: blue
          urlcolor: blue
          header-includes:
            - \usepackage{fancyhdr}
            - \pagestyle{fancy}
            - \fancyhead[L]{\leftmark}
            - \fancyhead[R]{\thepage}
            - \fancyfoot[C]{}
          METADATA

      - name: Collect Chapters
        run: |
          # Chapter order is defined once, in book.manifest.json.
          # See scripts/book_structure.py (enforced by scripts/validate_docs.py).
          python3 scripts/book_structure.py --chapters > build/chapters.txt
          test -s build/chapters.txt
          echo "Collected $(wc -l < build/chapters.txt | tr -d ' ') chapters"

      - name: Prepare Book Sources
        run: |
          # Renders Mermaid diagrams to images, turns chapter links into in-book
          # anchors, and adds part divider pages. See scripts/build_book_sources.py.
          # --check-locale also renders the Japanese edition's diagrams, so a syntax
          # error there fails this job instead of shipping a broken figure to the site.
          CHROME="$(command -v google-chrome || command -v chromium-browser || command -v chromium)"
          test -n "$CHROME"
          PUPPETEER_EXECUTABLE_PATH="$CHROME" python3 scripts/build_book_sources.py \
            --chapter-list build/chapters.txt \
            --out build/src \
            --mmdc "$PWD/build/tools/node_modules/.bin/mmdc" \
            --check-locale ja \
            --require-diagrams > build/sources.txt
          test -s build/sources.txt

      - name: Build PDF
        run: |
          # Source paths in build/sources.txt are relative to build/.
          mapfile -t CHAPTER_FILES < build/sources.txt
          
          cd build
          pandoc \
            --from=markdown+tex_math_dollars \
            --to=pdf \
            --resource-path=. \
            --output=system-design-patterns.pdf \
            --pdf-engine=xelatex \
            --metadata-file=metadata.yaml \
            --toc \
            --toc-depth=2 \
            --number-sections \
            --top-level-division=chapter \
            --highlight-style=tango \
            front-matter.md \
            "${CHAPTER_FILES[@]}"
          
          echo "PDF built successfully!"
          ls -lh system-design-patterns.pdf

      - name: Build EPUB
        run: |
          # Source paths in build/sources.txt are relative to build/.
          mapfile -t CHAPTER_FILES < build/sources.txt
          
          cd build
          pandoc \
            --from=markdown+tex_math_dollars \
            --to=epub \
            --resource-path=. \
            --output=system-design-patterns.epub \
            --metadata-file=metadata.yaml \
            --toc \
            --toc-depth=2 \
            --split-level=1 \
            --highlight-style=tango \
            front-matter.md \
            "${CHAPTER_FILES[@]}"
          
          echo "EPUB built successfully!"
          ls -lh system-design-patterns.epub

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: book-files
          path: |
            build/system-design-patterns.pdf
            build/system-design-patterns.epub
          retention-days: 30

      - name: Delete existing nightly release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete nightly --cleanup-tag --yes || echo "No existing nightly release to delete"

      - name: Create Rolling Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: "Latest Build"
          prerelease: false
          make_latest: true
          generate_release_notes: false
          body: "Auto-updated on every push to main."
          files: |
            build/system-design-patterns.pdf
            build/system-design-patterns.epub

      - name: Create Tagged Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/system-design-patterns.pdf
            build/system-design-patterns.epub
          generate_release_notes: true
          make_latest: false
